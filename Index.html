<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎾 Padel Americano Tournament</title>
  <meta name="description" content="Manage your Padel Americano tournament for 8 players and 2 courts. Real-time scores and automatic leaderboard." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0b0f1a;
      --surface: #131929;
      --surface2: #1b2540;
      --surface3: #222f4e;
      --border: rgba(255,255,255,0.07);
      --accent: #00d4aa;
      --accent2: #7c3aed;
      --accent3: #f59e0b;
      --gold: #ffd700;
      --silver: #c0c0c0;
      --bronze: #cd7f32;
      --text: #e8eaf6;
      --text-muted: #8892b0;
      --danger: #ef4444;
      --court-a: #00d4aa;
      --court-b: #7c3aed;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 10% 0%, rgba(0,212,170,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 90% 100%, rgba(124,58,237,0.1) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .app { position: relative; z-index: 1; }

    .header {
      text-align: center;
      padding: 2rem 1rem 1rem;
    }
    .header .logo {
      font-size: 2.8rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent) 0%, #00b4d8 50%, var(--accent2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -1px;
    }
    .header .sub {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 0.3rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    /* ── SETUP ── */
    .setup-container {
      max-width: 540px;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
    }
    .setup-title { font-size: 1.4rem; font-weight: 700; text-align: center; margin-bottom: 0.4rem; }
    .setup-desc { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 2rem; }
    .players-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; margin-bottom: 2rem; }

    .player-input-wrap { position: relative; }
    .player-num {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      font-size: 0.75rem; font-weight: 700; color: var(--accent);
      background: rgba(0,212,170,0.12); border-radius: 50%;
      width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
    }
    .player-input-wrap input {
      width: 100%; background: var(--surface2); border: 1.5px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text);
      font-family: 'Inter', sans-serif; font-size: 0.95rem;
      padding: 0.75rem 0.75rem 0.75rem 2.5rem; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .player-input-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,212,170,0.15); }
    .player-input-wrap input::placeholder { color: var(--text-muted); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      padding: 0.85rem 2rem; border-radius: var(--radius-sm); border: none;
      font-family: 'Inter', sans-serif; font-weight: 600; font-size: 1rem; cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary { background: linear-gradient(135deg, var(--accent), #00b4d8); color: #0b0f1a; width: 100%; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,212,170,0.35); }
    .btn-primary:active { transform: translateY(0); }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1.5px solid var(--border); }
    .btn-secondary:hover { background: var(--surface3); border-color: var(--accent); }

    /* ── GAME ── */
    .game-layout {
      display: grid; grid-template-columns: 1fr 300px; gap: 1.5rem;
      max-width: 1100px; margin: 0 auto; padding: 1rem 1.5rem 3rem;
    }
    @media (max-width: 768px) {
      .game-layout { grid-template-columns: 1fr; }
      .sidebar { order: -1; }
    }

    .round-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.2rem; flex-wrap: wrap; gap: 0.5rem;
    }
    .round-badge {
      background: linear-gradient(135deg, var(--accent2), #9333ea);
      color: white; font-size: 0.8rem; font-weight: 700;
      padding: 0.35rem 1rem; border-radius: 20px; letter-spacing: 1px; text-transform: uppercase;
    }
    .round-progress { display: flex; gap: 0.4rem; }
    .round-dot { width: 28px; height: 8px; border-radius: 4px; background: var(--surface3); transition: background 0.3s; }
    .round-dot.done { background: var(--accent); }
    .round-dot.current { background: var(--accent2); }

    .courts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem; }
    @media (max-width: 560px) { .courts-grid { grid-template-columns: 1fr; } }

    .court-card { background: var(--surface); border-radius: var(--radius); border: 1.5px solid var(--border); overflow: hidden; box-shadow: var(--shadow); }
    .court-header { padding: 0.75rem 1rem; display: flex; align-items: center; gap: 0.5rem; font-weight: 700; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; }
    .court-header.court-a { background: linear-gradient(90deg, rgba(0,212,170,0.2), transparent); color: var(--court-a); border-bottom: 1px solid rgba(0,212,170,0.2); }
    .court-header.court-b { background: linear-gradient(90deg, rgba(124,58,237,0.2), transparent); color: var(--court-b); border-bottom: 1px solid rgba(124,58,237,0.2); }
    .court-dot { width: 8px; height: 8px; border-radius: 50%; }
    .court-a .court-dot { background: var(--court-a); box-shadow: 0 0 8px var(--court-a); }
    .court-b .court-dot { background: var(--court-b); box-shadow: 0 0 8px var(--court-b); }

    .match-body { padding: 1rem; }
    .team-row { display: flex; align-items: center; gap: 0.6rem; padding: 0.6rem 0.8rem; border-radius: var(--radius-sm); background: var(--surface2); margin-bottom: 0.5rem; }
    .team-names { flex: 1; font-size: 0.88rem; font-weight: 600; }
    .team-emoji { font-size: 1.1rem; }
    .vs-label { text-align: center; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); letter-spacing: 2px; padding: 0.15rem 0; }

    .score-section { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border); }
    .score-label { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.7rem; text-align: center; }
    .score-inputs { display: flex; align-items: center; gap: 0.6rem; justify-content: center; }
    .score-input-wrap { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; }
    .score-input-label { font-size: 0.7rem; color: var(--text-muted); font-weight: 500; }
    .score-input {
      width: 64px; height: 64px; background: var(--surface2); border: 2px solid var(--border);
      border-radius: 12px; color: var(--text); font-family: 'Inter', sans-serif;
      font-size: 1.6rem; font-weight: 700; text-align: center; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s; -moz-appearance: textfield;
    }
    .score-input::-webkit-inner-spin-button, .score-input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .score-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,212,170,0.15); }
    .score-separator { font-size: 1.4rem; font-weight: 300; color: var(--text-muted); }
    .score-saved { display: flex; align-items: center; justify-content: center; gap: 0.4rem; font-size: 0.78rem; color: var(--accent); font-weight: 600; margin-top: 0.6rem; opacity: 0; transition: opacity 0.3s; }
    .score-saved.visible { opacity: 1; }

    .action-bar { display: flex; gap: 0.8rem; flex-wrap: wrap; }
    .action-bar .btn { flex: 1; min-width: 140px; }

    /* ── SIDEBAR ── */
    .sidebar-card { background: var(--surface); border-radius: var(--radius); border: 1.5px solid var(--border); overflow: hidden; box-shadow: var(--shadow); position: sticky; top: 1rem; }
    .sidebar-title { padding: 1rem 1.2rem; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 0.5rem; }
    .leaderboard-list { padding: 0.6rem 0; }
    .leaderboard-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.55rem 1.2rem; transition: background 0.2s; }
    .leaderboard-item:hover { background: var(--surface2); }
    .lb-rank { font-size: 0.75rem; font-weight: 800; width: 20px; text-align: center; color: var(--text-muted); }
    .lb-rank.r1 { color: var(--gold); }
    .lb-rank.r2 { color: var(--silver); }
    .lb-rank.r3 { color: var(--bronze); }
    .lb-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; flex-shrink: 0; }
    .lb-name { flex: 1; font-size: 0.88rem; font-weight: 600; }
    .lb-pts { font-size: 0.88rem; font-weight: 700; color: var(--accent); }
    .lb-pts span { font-size: 0.65rem; color: var(--text-muted); font-weight: 400; }

    /* ── PODIUM ── */
    .podium-container { max-width: 700px; margin: 0 auto; padding: 1.5rem 1rem 3rem; text-align: center; }
    .podium-title { font-size: 2rem; font-weight: 900; margin-bottom: 0.3rem; background: linear-gradient(135deg, var(--gold), var(--accent3)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .podium-sub { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2.5rem; }
    .confetti-row { font-size: 2.5rem; margin-bottom: 1.5rem; animation: bounce 1.5s infinite alternate; }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-8px); } }

    .podium { display: flex; align-items: flex-end; justify-content: center; gap: 1rem; margin-bottom: 2rem; }
    .podium-place { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
    .podium-avatar { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 700; border: 3px solid transparent; }
    .podium-avatar.p1 { border-color: var(--gold); box-shadow: 0 0 20px rgba(255,215,0,0.4); }
    .podium-avatar.p2 { border-color: var(--silver); box-shadow: 0 0 20px rgba(192,192,192,0.3); }
    .podium-avatar.p3 { border-color: var(--bronze); box-shadow: 0 0 20px rgba(205,127,50,0.3); }
    .podium-medal { font-size: 1.5rem; }
    .podium-pname { font-weight: 700; font-size: 0.9rem; }
    .podium-ppts { font-size: 0.8rem; color: var(--text-muted); }
    .podium-block { border-radius: 12px 12px 0 0; width: 100px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 900; }
    .podium-block.b1 { height: 100px; background: linear-gradient(180deg, rgba(255,215,0,0.3), rgba(255,215,0,0.1)); border: 1px solid rgba(255,215,0,0.3); color: var(--gold); }
    .podium-block.b2 { height: 75px; background: linear-gradient(180deg, rgba(192,192,192,0.3), rgba(192,192,192,0.1)); border: 1px solid rgba(192,192,192,0.3); color: var(--silver); }
    .podium-block.b3 { height: 55px; background: linear-gradient(180deg, rgba(205,127,50,0.3), rgba(205,127,50,0.1)); border: 1px solid rgba(205,127,50,0.3); color: var(--bronze); }

    .final-list { background: var(--surface); border-radius: var(--radius); border: 1.5px solid var(--border); overflow: hidden; margin-bottom: 2rem; }
    .final-list-title { padding: 0.8rem 1.2rem; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); border-bottom: 1px solid var(--border); }
    .final-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.7rem 1.2rem; border-bottom: 1px solid var(--border); }
    .final-item:last-child { border-bottom: none; }

    .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--surface3); border: 1.5px solid var(--accent); border-radius: 50px; padding: 0.65rem 1.4rem; font-size: 0.85rem; font-weight: 600; color: var(--accent); z-index: 999; transition: transform 0.3s ease; white-space: nowrap; }
    .toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 480px) {
      .header .logo { font-size: 2rem; }
      .score-input { width: 56px; height: 56px; font-size: 1.4rem; }
      .podium-block { width: 80px; }
    }
  </style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="logo">🎾 Padel Americano</div>
    <div class="sub">8 players &middot; 2 courts &middot; 7 rounds</div>
  </div>

  <!-- SETUP -->
  <div id="screen-setup" class="screen active">
    <div class="setup-container">
      <div class="setup-title">Enter the players</div>
      <div class="setup-desc">Enter the names of all 8 players, then hit Start!</div>
      <div class="players-grid" id="players-grid"></div>
      <button class="btn btn-primary" id="btn-start" onclick="startTournament()">🚀 Start Tournament</button>
    </div>
  </div>

  <!-- GAME -->
  <div id="screen-game" class="screen">
    <div class="game-layout">
      <div class="main-col">
        <div class="round-header">
          <div class="round-badge" id="round-label">Round 1 / 7</div>
          <div class="round-progress" id="round-progress"></div>
        </div>
        <div class="courts-grid" id="courts-grid"></div>
        <div class="action-bar">
          <button class="btn btn-secondary" id="btn-prev" onclick="prevRound()">&#8592; Previous Round</button>
          <button class="btn btn-primary" id="btn-next" onclick="nextRound()">Next Round &#8594;</button>
        </div>
      </div>
      <div class="sidebar">
        <div class="sidebar-card">
          <div class="sidebar-title">&#127885; Live Standings</div>
          <div class="leaderboard-list" id="leaderboard"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- PODIUM -->
  <div id="screen-podium" class="screen">
    <div class="podium-container">
      <div class="confetti-row">🎉 🏆 🎉</div>
      <div class="podium-title">Final Standings</div>
      <div class="podium-sub">Americano &mdash; 8 players &mdash; 7 rounds</div>
      <div class="podium" id="podium"></div>
      <div class="final-list">
        <div class="final-list-title">Full leaderboard</div>
        <div id="final-list"></div>
      </div>
      <button class="btn btn-secondary" onclick="restartTournament()">&#8617;&#65039; New Tournament</button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const SCHEDULE = [
  [ [[0,1],[2,3]], [[4,5],[6,7]] ],
  [ [[0,2],[1,4]], [[5,6],[3,7]] ],
  [ [[0,3],[1,5]], [[4,7],[2,6]] ],
  [ [[0,4],[2,5]], [[3,6],[1,7]] ],
  [ [[0,5],[3,4]], [[1,6],[2,7]] ],
  [ [[0,6],[1,3]], [[2,4],[5,7]] ],
  [ [[0,7],[4,6]], [[1,2],[3,5]] ],
];

const AVATAR_COLORS = ['#00d4aa','#7c3aed','#f59e0b','#ef4444','#3b82f6','#ec4899','#10b981','#f97316'];
const EMOJIS = ['🟢','🟣','🟡','🔴','🔵','🩷','🟩','🟠'];

let players = [];
let scores = {};
let currentRound = 0;

function initSetup() {
  const grid = document.getElementById('players-grid');
  grid.innerHTML = '';
  const defaults = ['Marco','Luca','Sara','Anna','Gianni','Piero','Chiara','Roberto'];
  for (let i = 0; i < 8; i++) {
    grid.innerHTML += `
      <div class="player-input-wrap">
        <span class="player-num">${i+1}</span>
        <input type="text" id="p${i}" placeholder="Player ${i+1}" value="${defaults[i]}" maxlength="14" autocomplete="off" />
      </div>`;
  }
}

function startTournament() {
  players = [];
  for (let i = 0; i < 8; i++) {
    const val = document.getElementById('p' + i).value.trim();
    players.push(val || 'G' + (i+1));
  }
  scores = {};
  currentRound = 0;
  showScreen('screen-game');
  renderGame();
}

function renderGame() {
  const prog = document.getElementById('round-progress');
  prog.innerHTML = '';
  for (let i = 0; i < 7; i++) {
    const cls = i < currentRound ? 'done' : i === currentRound ? 'current' : '';
    prog.innerHTML += '<div class="round-dot ' + cls + '"></div>';
  }

  document.getElementById('round-label').textContent = 'Round ' + (currentRound + 1) + ' of 7';

  const courtsGrid = document.getElementById('courts-grid');
  courtsGrid.innerHTML = '';
  const roundMatches = SCHEDULE[currentRound];

  roundMatches.forEach(function(match, ci) {
    const key = currentRound + '-' + ci;
    const saved = scores[key] || { a: '', b: '' };
    const courtName = ci === 0 ? 'Court A' : 'Court B';
    const courtClass = ci === 0 ? 'court-a' : 'court-b';

    const t1 = [players[match[0][0]], players[match[0][1]]];
    const t2 = [players[match[1][0]], players[match[1][1]]];
    const short1 = t1[0].split(' ')[0] + '&' + t1[1].split(' ')[0];
    const short2 = t2[0].split(' ')[0] + '&' + t2[1].split(' ')[0];

    courtsGrid.innerHTML += '<div class="court-card">' +
      '<div class="court-header ' + courtClass + '">' +
        '<span class="court-dot"></span>' + courtName +
      '</div>' +
      '<div class="match-body">' +
        '<div class="team-row"><span class="team-emoji">' + EMOJIS[match[0][0]] + '</span><span class="team-names">' + t1[0] + ' &amp; ' + t1[1] + '</span></div>' +
        '<div class="vs-label">VS</div>' +
        '<div class="team-row"><span class="team-emoji">' + EMOJIS[match[1][0]] + '</span><span class="team-names">' + t2[0] + ' &amp; ' + t2[1] + '</span></div>' +
        '<div class="score-section">' +
          '<div class="score-label">Score</div>' +
          '<div class="score-inputs">' +
            '<div class="score-input-wrap">' +
              '<span class="score-input-label">' + short1 + '</span>' +
              '<input class="score-input" type="number" min="0" max="99" id="score-' + currentRound + '-' + ci + '-a" value="' + saved.a + '" placeholder="0" oninput="saveScore(' + currentRound + ',' + ci + ',\'a\',this.value)" onfocus="this.select()" />' +
            '</div>' +
            '<span class="score-separator">&mdash;</span>' +
            '<div class="score-input-wrap">' +
              '<span class="score-input-label">' + short2 + '</span>' +
              '<input class="score-input" type="number" min="0" max="99" id="score-' + currentRound + '-' + ci + '-b" value="' + saved.b + '" placeholder="0" oninput="saveScore(' + currentRound + ',' + ci + ',\'b\',this.value)" onfocus="this.select()" />' +
            '</div>' +
          '</div>' +
          '<div class="score-saved" id="saved-' + currentRound + '-' + ci + '">&#10003; Saved</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  });

  document.getElementById('btn-prev').style.display = currentRound === 0 ? 'none' : '';
  document.getElementById('btn-next').textContent = currentRound === 6 ? '🏆 See Final Standings' : 'Next Round →';

  renderLeaderboard();
}

function saveScore(round, court, team, value) {
  const key = round + '-' + court;
  if (!scores[key]) scores[key] = { a: '', b: '' };
  scores[key][team] = value === '' ? '' : (parseInt(value) || 0);
  const el = document.getElementById('saved-' + round + '-' + court);
  if (el) {
    el.classList.add('visible');
    clearTimeout(el._t);
    el._t = setTimeout(function() { el.classList.remove('visible'); }, 1500);
  }
  renderLeaderboard();
}

function nextRound() {
  if (currentRound === 6) { showPodium(); return; }
  currentRound++;
  renderGame();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function prevRound() {
  if (currentRound > 0) { currentRound--; renderGame(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
}

function calcTotals() {
  const totals = [0,0,0,0,0,0,0,0];
  for (let r = 0; r < 7; r++) {
    for (let c = 0; c < 2; c++) {
      const s = scores[r + '-' + c];
      if (!s || s.a === '' || s.b === '') continue;
      const match = SCHEDULE[r][c];
      const pa = parseInt(s.a) || 0;
      const pb = parseInt(s.b) || 0;
      match[0].forEach(function(i) { totals[i] += pa; });
      match[1].forEach(function(i) { totals[i] += pb; });
    }
  }
  return totals;
}

function renderLeaderboard() {
  const totals = calcTotals();
  const ranked = players.map(function(name, i) { return { name: name, pts: totals[i], idx: i }; })
    .sort(function(a, b) { return b.pts - a.pts; });
  const list = document.getElementById('leaderboard');
  if (!list) return;
  list.innerHTML = '';
  ranked.forEach(function(p, rank) {
    const rankCls = rank === 0 ? 'r1' : rank === 1 ? 'r2' : rank === 2 ? 'r3' : '';
    const medal = rank === 0 ? '🥇' : rank === 1 ? '🥈' : rank === 2 ? '🥉' : '';
    list.innerHTML += '<div class="leaderboard-item">' +
      '<span class="lb-rank ' + rankCls + '">' + (medal || (rank+1)) + '</span>' +
      '<div class="lb-avatar" style="background:' + AVATAR_COLORS[p.idx] + '22;color:' + AVATAR_COLORS[p.idx] + '">' + initials(p.name) + '</div>' +
      '<span class="lb-name">' + p.name + '</span>' +
      '<span class="lb-pts">' + p.pts + '<span> pt</span></span>' +
    '</div>';
  });
}

function showPodium() {
  const totals = calcTotals();
  const ranked = players.map(function(name, i) { return { name: name, pts: totals[i], idx: i }; })
    .sort(function(a, b) { return b.pts - a.pts; });

  const podiumEl = document.getElementById('podium');
  const order = [1, 0, 2];
  const medals = ['🥇','🥈','🥉'];
  const blockCls = ['b1','b2','b3'];
  const avatarCls = ['p1','p2','p3'];
  podiumEl.innerHTML = '';
  order.forEach(function(rank) {
    const p = ranked[rank];
    if (!p) return;
    podiumEl.innerHTML += '<div class="podium-place">' +
      '<div class="podium-medal">' + medals[rank] + '</div>' +
      '<div class="podium-avatar ' + avatarCls[rank] + '" style="background:' + AVATAR_COLORS[p.idx] + '22;color:' + AVATAR_COLORS[p.idx] + '">' + initials(p.name) + '</div>' +
      '<div class="podium-pname">' + p.name + '</div>' +
      '<div class="podium-ppts">' + p.pts + ' pt</div>' +
      '<div class="podium-block ' + blockCls[rank] + '">' + (rank+1) + '°</div>' +
    '</div>';
  });

  const finalList = document.getElementById('final-list');
  finalList.innerHTML = '';
  ranked.forEach(function(p, rank) {
    const medal = rank < 3 ? ['🥇','🥈','🥉'][rank] : (rank+1) + '°';
    const rankCls = rank === 0 ? 'r1' : rank === 1 ? 'r2' : rank === 2 ? 'r3' : '';
    finalList.innerHTML += '<div class="final-item">' +
      '<span class="lb-rank ' + rankCls + '" style="font-size:0.9rem">' + medal + '</span>' +
      '<div class="lb-avatar" style="background:' + AVATAR_COLORS[p.idx] + '22;color:' + AVATAR_COLORS[p.idx] + '">' + initials(p.name) + '</div>' +
      '<span class="lb-name">' + p.name + '</span>' +
      '<span class="lb-pts">' + p.pts + '<span> pt</span></span>' +
    '</div>';
  });

  showScreen('screen-podium');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restartTournament() { showScreen('screen-setup'); }

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}

function initials(name) {
  return name.split(' ').map(function(w) { return w[0]; }).join('').toUpperCase().slice(0,2);
}

initSetup();
</script>
</body>
</html>
